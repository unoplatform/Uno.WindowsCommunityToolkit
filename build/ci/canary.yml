steps:

  - task: UseDotNet@2
    inputs:
      packageType: sdk
      useGlobalJson: true
      includePreviewVersions: true

  - task: unoplatformCanaryUpdater@1
    displayName: 'Canary Update'
    retryCountOnTaskFailure: 3
    condition: startsWith(variables['Build.SourceBranch'], 'refs/heads/canaries/')
    inputs:
      solution: 'Windows Community Toolkit.sln'
      branchToMerge: uno
      summaryFile: '$(Build.ArtifactStagingDirectory)/Canary.md'
      resultFile: '$(Build.ArtifactStagingDirectory)/update_result.json'
      nugetUpdaterVersion: '1.3.1'
      packageAuthor: 'Uno Platform,unoplatform,Microsoft.Xaml.Interactivity'
      additionalPublicSources: 'https://pkgs.dev.azure.com/uno-platform/1dd81cbd-cb35-41de-a570-b0df3571a196/_packaging/unoplatformdev/nuget/v3/index.json'
