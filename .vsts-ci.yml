trigger:
- master
- rel/*
- unorel/winui/*
- feature/uno7

jobs:
- job: Windows

  pool:
    vmImage: 'windows-2022'

  variables:
  - group: uno-codesign-vault
  - name: BuildConfiguration
    value: Release

  steps:

  - template: build/ci/canary.yml
  - template: build/ci/dotnet-install.yml

  - task: DotNetCoreCLI@2
    inputs:
      command: custom
      custom: tool
      arguments: install --tool-path . nbgv --version 3.6.146
    displayName: Install NBGV tool

  - script: nbgv cloud
    displayName: Set Version

  - script: dotnet build "Windows Community Toolkit (UNO).slnf" -c $(BuildConfiguration) "-bl:$(Build.ArtifactStagingDirectory)\logs\build.binlog"
    displayName: Build

  # Not --no-build: packing makes Uno.Sdk build the project references again, which NoBuild rejects (NETSDK1085).
  - script: dotnet pack "Windows Community Toolkit (UNO).slnf" -c $(BuildConfiguration) --no-restore -o "$(Build.SourcesDirectory)\bin\nupkg" "-bl:$(Build.ArtifactStagingDirectory)\logs\pack.binlog"
    displayName: Pack

  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '8.0.x'
    displayName: Use .NET SDK 8.x for signing

  - template: build/ci/sign-packages.yml

  - task: PublishBuildArtifacts@1
    displayName: Publish Package Artifacts
    inputs:
      pathToPublish: .\bin\nupkg
      artifactType: container
      artifactName: WCT-Packages
    condition: always()

  - task: PublishBuildArtifacts@1
    displayName: Publish Build Logs
    inputs:
      pathToPublish: $(Build.ArtifactStagingDirectory)\logs
      artifactType: container
      artifactName: logs-windows
    condition: always()

- job: linux

  pool:
    vmImage: 'ubuntu-latest'

  steps:
  - checkout: self
    clean: true

  - template: build/ci/canary.yml
  - template: build/ci/dotnet-install.yml

  # Publishes to the default folder: an -o path reaches Uno.Wasm.Bootstrap without its trailing slash,
  # and it then looks for the site in "<dir>wwwroot".
  - bash: dotnet publish CommunityToolkit.WinUI.SampleApp.Uno/CommunityToolkit.WinUI.SampleApp.Uno.csproj -f net10.0-browserwasm -c Release "-bl:$(build.artifactstagingdirectory)/build.binlog"
    displayName: Publish the WebAssembly sample

  - task: CopyFiles@2
    displayName: 'Publish Wasm Binaries'
    inputs:
      SourceFolder: $(build.sourcesdirectory)/CommunityToolkit.WinUI.SampleApp.Uno/bin/Release/net10.0-browserwasm/publish/wwwroot
      Contents: '**/*.*'
      TargetFolder: $(build.artifactstagingdirectory)
      CleanTargetFolder: false
      OverWrite: false
      flattenFolders: false

  # The artifact keeps its name for the deployment that consumes it; the site is not AOT-compiled any more.
  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: $(build.artifactstagingdirectory)
      ArtifactName: wct-aot-drop
      ArtifactType: Container

- job: RuntimeTests_Desktop
  displayName: Desktop Runtime Tests

  pool:
    vmImage: 'ubuntu-latest'

  variables:
    RuntimeTestsProject: CommunityToolkit.WinUI.RuntimeTests
    RuntimeTestsResults: $(Build.ArtifactStagingDirectory)/desktop-runtime-tests-results.xml

  steps:
  - checkout: self
    clean: true

  # Same canary update as the other jobs, so the tests run against the packages being packed.
  - template: build/ci/canary.yml

  - task: UseDotNet@2
    displayName: Use .NET SDK 10.0.x
    retryCountOnTaskFailure: 3
    inputs:
      packageType: sdk
      version: '10.0.x'

  - bash: dotnet build $(RuntimeTestsProject)/CommunityToolkit.WinUI.RuntimeTests.csproj -c Release "-bl:$(Build.ArtifactStagingDirectory)/build-runtime-tests.binlog"
    displayName: Build the runtime tests app

  # The engine runs every test on startup when UNO_RUNTIME_TESTS_RUN_TESTS is set, writes the
  # NUnit results to UNO_RUNTIME_TESTS_OUTPUT_PATH, then exits the app.
  - bash: |
      set -euo pipefail
      sudo apt-get update -qq
      sudo apt-get install -y -qq xvfb fluxbox
      cd $(RuntimeTestsProject)/bin/Release/net10.0-desktop
      xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' bash -c "{ fluxbox & } ; dotnet CommunityToolkit.WinUI.RuntimeTests.dll" || true
      if [ ! -f "$UNO_RUNTIME_TESTS_OUTPUT_PATH" ]; then
        echo "Runtime tests did not produce results at $UNO_RUNTIME_TESTS_OUTPUT_PATH"
        exit 1
      fi
    displayName: Run the runtime tests
    env:
      UNO_RUNTIME_TESTS_RUN_TESTS: '{}'
      UNO_RUNTIME_TESTS_OUTPUT_PATH: $(RuntimeTestsResults)

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testRunTitle: 'Desktop Runtime Tests'
      testResultsFormat: 'NUnit'
      testResultsFiles: $(RuntimeTestsResults)
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: $(Build.ArtifactStagingDirectory)
      ArtifactName: runtime-tests
      ArtifactType: Container
